<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-card {
      transition: all 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-4">Our Products</h2>
    <div class="row g-4">
      <div class="col-md-3 col-sm-6">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/200?1" class="card-img-top" alt="Product">
          <div class="card-body text-center">
            <h5 class="card-title">Product 1</h5>
            <p class="text-muted">$29.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/200?2" class="card-img-top" alt="Product">
          <div class="card-body text-center">
            <h5 class="card-title">Product 2</h5>
            <p class="text-muted">$39.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/200?3" class="card-img-top" alt="Product">
          <div class="card-body text-center">
            <h5 class="card-title">Product 3</h5>
            <p class="text-muted">$24.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/200?4" class="card-img-top" alt="Product">
          <div class="card-body text-center">
            <h5 class="card-title">Product 4</h5>
            <p class="text-muted">$19.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
