<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Q6 - Employee System</title></head>
<body>
<h2>Q6 - Employee Management</h2>
<div id="report"></div>
<script>
class Employee {
constructor(id,name,dept,salary){Object.assign(this,{id,name,department:dept,salary})}
getAnnualSalary = ()=> this.salary * 12
applyBonus = (percent)=> this.salary += this.salary * (percent/100)
}


const emps = [
new Employee(1,'A','IT',40000),
new Employee(2,'B','HR',35000),
new Employee(3,'C','Sales',30000),
new Employee(4,'D','Dev',50000),
new Employee(5,'E','QA',32000)
];


// calculate annual salary and optionally apply bonus
emps.forEach(e=> e.applyBonus(5)); // apply 5% sample bonus
const totals = emps.map(e=> ({name:e.name, annual:e.getAnnualSalary()}));


const totalPayout = emps.reduce((sum,e)=> sum + e.getAnnualSalary(), 0);


document.getElementById('report').textContent = `Employees:\n${JSON.stringify(totals,null,2)}\n\nTotal Annual Payout: ₹${totalPayout}`;
</script>
</body>
</html>
