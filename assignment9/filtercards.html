<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="filter-cards.css">
</head>
<body>

  <h1>Animated Profile Cards</h1>

  <div class="profile-container">
    <div class="profile-card">
      <img src="https://picsum.photos/200?random=1" alt="Profile 1">
      <h3>Jane Doe</h3>
      <p>Web Designer</p>
    </div>
    <div class="profile-card">
      <img src="https://picsum.photos/200?random=2" alt="Profile 2">
      <h3>John Smith</h3>
      <p>Frontend Developer</p>
    </div>
    <div class="profile-card">
      <img src="https://picsum.photos/200?random=3" alt="Profile 3">
      <h3>Mary Johnson</h3>
      <p>UI/UX Expert</p>
    </div>
  </div>

</body>
</html>
