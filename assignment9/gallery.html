<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>

  <h1>Responsive Image Filter Gallery</h1>

  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/300/200?random=1" alt="Blur Effect">
      <figcaption>Blur</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?random=2" alt="Grayscale">
      <figcaption>Grayscale</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?random=3" alt="Sepia">
      <figcaption>Sepia</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?random=4" alt="Brightness">
      <figcaption>Brightness</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?random=5" alt="Contrast">
      <figcaption>Contrast</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/300/200?random=6" alt="Hue Rotate">
      <figcaption>Hue Rotate</figcaption>
    </figure>
  </div>

</body>
</html>
