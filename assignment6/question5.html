<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout using CSS Grid</title>
  <style>
    /* ===== Basic Reset ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color: #f4f4f9;
      height: 100vh;
      display: grid;
      grid-template-columns: 250px 1fr;
      grid-template-rows: 60px 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      gap: 20px;
    }

    /* ===== Header ===== */
    header {
      grid-area: header;
      background-color: #2c3e50;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* ===== Sidebar ===== */
    aside {
      grid-area: sidebar;
      background-color: #34495e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
    }

    aside nav ul {
      list-style: none;
      width: 100%;
    }

    aside nav ul li {
      padding: 15px 20px;
      text-align: left;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    aside nav ul li:hover {
      background-color: #1abc9c;
    }

    /* ===== Main Content ===== */
    main {
      grid-area: main;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .box {
      background-color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      font-weight: 500;
      color: #2c3e50;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    /* One box spans two columns */
    .box.wide {
      grid-column: span 2;
    }

    /* Hover Effects */
    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* ===== Responsive Layout ===== */
    @media (max-width: 800px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: 60px auto auto;
        grid-template-areas:
          "header"
          "sidebar"
          "main";
      }

      aside {
        flex-direction: row;
        justify-content: space-around;
        padding: 10px;
      }

      main {
        grid-template-columns: 1fr;
      }

      .box.wide {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <!-- ===== Header ===== -->
  <header>
    Dashboard Overview
  </header>

  <!-- ===== Sidebar ===== -->
  <aside>
    <nav>
      <ul>
        <li>Home</li>
        <li>Analytics</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </nav>
  </aside>

  <!-- ===== Main Content ===== -->
  <main>
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box wide">Box 3 (Spans 2 Columns)</div>
    <div class="box">Box 4</div>
  </main>
</body>
</html>
