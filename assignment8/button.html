<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Reema Sharma">
  <title>Styled Button Collection</title>
  <style>
   
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f4f7fb;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    .button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    button {
      font-size: 16px;
      font-weight: 500;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      outline: none;
    }
    .primary {
      background-color: #007bff;
      color: white;
    }

    .primary:hover {
      background-color: #0069d9;
      transform: translateY(-2px);
    }
    .primary:active {
      background-color: #0056b3;
      transform: scale(0.97);
    }
    .secondary {
      background-color: #6c757d;
      color: white;
    }
    .secondary:hover {
      background-color: #5a6268;
      transform: translateY(-2px);
    }
    .secondary:active {
      background-color: #4e555b;
      transform: scale(0.97);
    }
    .outline {
      background: transparent;
      color: #007bff;
      border: 2px solid #007bff;
    }
    .outline:hover {
      background-color: #007bff;
      color: white;
      transform: translateY(-2px);
    }
    .outline:active {
      background-color: #0056b3;
      color: white;
      transform: scale(0.97);
    }
    button:disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    button:focus {
      outline: 3px solid rgba(0, 123, 255, 0.4);
      outline-offset: 2px;
    }
    .label {
      text-align: center;
      color: #444;
      font-weight: 500;
      margin-top: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Styled Button Collection</h1>
  <div class="button-container">
    <div>
      <button class="primary">Primary Button</button>
      <div class="label">:hover, :active, :focus</div>
    </div>
    <div>
      <button class="secondary">Secondary Button</button>
      <div class="label">Gray variant</div>
    </div>
    <div>
      <button class="outline">Outline Button</button>
      <div class="label">Border only</div>
    </div>
    <div>
      <button disabled>Disabled Button</button>
      <div class="label">:disabled state</div>
    </div>
  </div>
</body>
</html>
