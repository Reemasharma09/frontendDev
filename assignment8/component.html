<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Reema Sharma">
  <title>User Interface Components Page</title>
  <style>
    /* ====== Page Layout ====== */
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #dfe9f3 0%, #ffffff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ====== Card Container ====== */
    .ui-card {
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 350px;
      text-align: center;
    }

    h1 {
      color: #333;
      font-size: 22px;
      margin-bottom: 10px;
    }

    /* ====== Search Bar ====== */
    .search-bar {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .search-bar input {
      flex: 1;
      padding: 10px 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .search-bar input:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
      outline: none;
    }

    /* ====== Buttons ====== */
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease-in-out;
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
    }

    .btn-primary:hover {
      background-color: #0069d9;
      transform: translateY(-2px);
    }

    .btn-primary:active {
      background-color: #0056b3;
      transform: scale(0.97);
    }

    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #5a6268;
      transform: translateY(-2px);
    }

    .btn-secondary:active {
      background-color: #4e555b;
      transform: scale(0.97);
    }
    select {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background-color: #fff;
      cursor: pointer;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    select:hover {
      border-color: #007bff;
    }
    select:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.4);
      outline: none;
    }
    p {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="ui-card">
    <h1>UI Components Demo</h1>

    <div class="search-bar">
      <input type="text" placeholder="Search here...">
      <button class="btn-primary">Go</button>
    </div>
    <div class="button-group">
      <button class="btn-primary">Submit</button>
      <button class="btn-secondary">Cancel</button>
    </div>
    <select>
      <option selected disabled>Choose an option</option>
      <option>Profile Settings</option>
      <option>Notifications</option>
      <option>Logout</option>
    </select>

    <p>Hover or focus elements to see the effects</p>
  </div>
</body>
</html>
