<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Reema Sharma">
  <title>CSS Tooltip Demonstration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f7fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .tooltip-container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .tooltip {
      position: relative;
      display: inline-block;
      cursor: pointer;
      font-size: 1.2em;
      padding: 10px;
      background: #ffffff;
      border: 2px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }
    .tooltip:hover {
      transform: scale(1.05);
    }
    .tooltip .tooltip-text {
      visibility: hidden;
      opacity: 0;
      width: 160px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 8px;
      position: absolute;
      z-index: 1;
      bottom: 125%; 
      left: 50%;
      transform: translateX(-50%);
      transition: opacity 0.3s ease-in-out;
    }
    .tooltip .tooltip-text::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #333 transparent transparent transparent;
    }
    .tooltip:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Tooltip Demonstration (CSS Only)</h1>

  <div class="tooltip-container">
    <div class="tooltip">
      <span class="tooltip-text">Home Icon Tooltip</span>
    </div>
    <div class="tooltip">
      <span class="tooltip-text">Message Icon Tooltip</span>
    </div>
    <div class="tooltip">
      <span class="tooltip-text">Like Button Tooltip</span>
    </div>
    <div class="tooltip">
      <strong>Hover Me</strong>
      <span class="tooltip-text">This is a text tooltip!</span>
    </div>
    <div class="tooltip">
      <span class="tooltip-text">Contact Tooltip</span>
    </div>
  </div>
</body>
</html>
